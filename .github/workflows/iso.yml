name: Build ISO

on:
  workflow_dispatch:
  push:
    tags:
      - "iso-*"

permissions:
  contents: write

env:
  ISO_VERSION: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve ISO version from tag
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == iso-* ]]; then
            echo "version=${GITHUB_REF_NAME#iso-}" >>"$GITHUB_OUTPUT"
          else
            echo "version=" >>"$GITHUB_OUTPUT"
          fi

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/zvonkiOS-pkg
          key: archiso-pkgs-${{ github.run_id }}
          restore-keys: |
            archiso-pkgs-

      - name: Build ISO in Arch container
        run: |
          docker run --rm --privileged \
            -v "$PWD:/repo" \
            -v "$HOME/.cache/zvonkiOS-pkg:/var/cache/pacman/pkg" \
            -e ISO_VERSION="${{ steps.ver.outputs.version }}" \
            -w /repo/distro \
            archlinux:latest \
            bash -lc 'pacman -Syu --noconfirm --needed archiso libarchive zstd && ./build.sh'

      - name: Show result
        run: ls -lh distro/out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zvonkiOS-iso
          if-no-files-found: error
          path: |
            distro/out/*.iso
            distro/out/*.pkg.tar.zst
            distro/out/sha256sums.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/iso-')
        uses: softprops/action-gh-release@v2
        with:
          name: ZвонкиОС ${{ github.ref_name }}
          body: |
            ZвонкиОС live ISO.

            ## Установка
            1. Запиши образ на флешку (`dd` или Ventoy в режиме DD).
            2. Загрузись, запусти `archinstall`.
            3. После установки: `zvonkiOS-brand /mnt` — брендинг попадёт на диск.

            ## Уже установлена система?
            `zvonkios-branding` можно поставить отдельно:

            ```bash
            curl -LO https://github.com/HoXs2/zvonkiOS-site/releases/latest/download/zvonkios-branding-1.0.0-1-any.pkg.tar.zst
            sudo pacman -U --overwrite 'etc/issue' --overwrite 'etc/skel/.bashrc' zvonkios-branding-*.pkg.tar.zst
            ```

            Звонки не отменяются.
          files: |
            distro/out/*.iso
            distro/out/*.pkg.tar.zst
            distro/out/sha256sums.txt
